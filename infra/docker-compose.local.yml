version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: safetyops-postgres
    environment:
      POSTGRES_DB: safetyops
      POSTGRES_USER: safetyops
      POSTGRES_PASSWORD: safetyops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: safetyops-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  api:
    image: python:3.11-slim
    container_name: safetyops-api
    working_dir: /app
    volumes:
      - ../:/app
    env_file:
      - ../.env
    command: >
      sh -c "pip install -r requirements.txt && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    image: python:3.11-slim
    container_name: safetyops-worker
    working_dir: /app
    volumes:
      - ../:/app
    env_file:
      - ../.env
    command: >
      sh -c "pip install -r requirements.txt && python -m services.worker.run"
    depends_on:
      - postgres
      - redis

  ui:
    image: python:3.11-slim
    container_name: safetyops-ui
    working_dir: /app
    volumes:
      - ../:/app
    env_file:
      - ../.env
    command: >
      sh -c "pip install -r requirements.txt && streamlit run apps/ui/main.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: safetyops-mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:///mlflow/mlflow.db
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"

  prometheus:
    image: prom/prometheus:latest
    container_name: safetyops-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: safetyops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mlflow_data: